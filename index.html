<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strange Attractors</title>
<style>
  :root{
    --panel:rgba(12,14,22,.84);
    --ink:#e8ecf5;
    --muted:#8a93a8;
    --accent:#7cf5d0;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05060a;color:var(--ink);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}

  #panel{position:fixed;top:16px;left:16px;width:280px;max-height:calc(100% - 32px);overflow:auto;
    background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);transition:opacity .25s,transform .25s}
  #panel.hidden{opacity:0;transform:translateX(-12px);pointer-events:none}
  #panel::-webkit-scrollbar{width:6px}
  #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

  h1{font-size:16px;margin:0 0 2px;letter-spacing:.03em;font-weight:650}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    margin:18px 0 8px;font-weight:600}
  select{width:100%;background:#151824;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font:inherit;outline:none}
  select:focus{border-color:var(--accent)}

  .ctl{margin:9px 0}
  .ctl .top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:4px}
  .ctl .top b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent) var(--p,50%),#262b3b var(--p,50%));outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 4px rgba(124,245,208,.18);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;cursor:pointer}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  button{background:#171b2a;color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:#1f2437;border-color:rgba(124,245,208,.4)}
  button.primary{background:linear-gradient(135deg,#7cf5d0,#8fb8ff);color:#06101a;border:0;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  #hint{position:fixed;right:16px;bottom:14px;color:rgba(232,236,245,.55);font-size:12px;
    text-align:right;pointer-events:none;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 8px #000}
  #toggle{position:fixed;top:16px;right:16px;padding:7px 11px;font-size:12px;background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
</style>
</head>
<body>
<canvas id="c" aria-label="Strange attractor visualization"></canvas>

<aside id="panel">
  <h1>Strange Attractors</h1>
  <div class="sub">Chaotic systems integrated live. Every trail is a real trajectory.</div>

  <h2>System</h2>
  <select id="attr"></select>
  <div id="params"></div>

  <h2>Motion</h2>
  <div id="motion"></div>

  <h2>Color</h2>
  <select id="palette" aria-label="Palette"></select>
  <div style="height:8px"></div>
  <select id="colorMode" aria-label="Color by"></select>
  <div id="look"></div>

  <div class="btns">
    <button id="randomize" class="primary">Randomize</button>
    <button id="reseed">Reseed</button>
    <button id="pause">Pause</button>
    <button id="save">Save PNG</button>
  </div>
</aside>

<button id="toggle" title="Toggle panel (H)">Hide panel</button>
<div id="hint"></div>

<script>
(() => {
'use strict';

/* ---------- Systems ----------------------------------------------------
   kind 'flow': 3D ODE, integrated with RK4.
   kind 'map' : 2D discrete iteration.
   span: half-extent in model units, used to fit the screen.           */
const ATTRACTORS = {
  lorenz: {
    name: 'Lorenz', kind: 'flow', dim: 3, dt: 0.004, span: 30, center: [0, 0, 25],
    params: { sigma: [10, 1, 20], rho: [28, 10, 40], beta: [2.667, 0.5, 5] },
    f(p, s, o) {
      o[0] = p.sigma * (s[1] - s[0]);
      o[1] = s[0] * (p.rho - s[2]) - s[1];
      o[2] = s[0] * s[1] - p.beta * s[2];
    },
    seed: () => [rnd(-6, 6), rnd(-6, 6), rnd(15, 35)]
  },
  rossler: {
    name: 'Rössler', kind: 'flow', dim: 3, dt: 0.02, span: 17, center: [0, 0, 2],
    params: { a: [0.2, 0.05, 0.5], b: [0.2, 0.05, 0.5], c: [5.7, 2, 12] },
    f(p, s, o) {
      o[0] = -s[1] - s[2];
      o[1] = s[0] + p.a * s[1];
      o[2] = p.b + s[2] * (s[0] - p.c);
    },
    seed: () => [rnd(-4, 4), rnd(-4, 4), rnd(0, 4)]
  },
  thomas: {
    name: 'Thomas (cyclically symmetric)', kind: 'flow', dim: 3, dt: 0.1, span: 4.2, center: [0, 0, 0],
    params: { b: [0.208186, 0.1, 0.3] },
    f(p, s, o) {
      o[0] = Math.sin(s[1]) - p.b * s[0];
      o[1] = Math.sin(s[2]) - p.b * s[1];
      o[2] = Math.sin(s[0]) - p.b * s[2];
    },
    seed: () => [rnd(-2, 2), rnd(-2, 2), rnd(-2, 2)]
  },
  clifford: {
    name: 'Clifford', kind: 'map', dim: 2, span: 2.7, center: [0, 0],
    params: { a: [-1.4, -2, 2], b: [1.6, -2, 2], c: [1.0, -2, 2], d: [0.7, -2, 2] },
    f(p, s, o) {
      o[0] = Math.sin(p.a * s[1]) + p.c * Math.cos(p.a * s[0]);
      o[1] = Math.sin(p.b * s[0]) + p.d * Math.cos(p.b * s[1]);
    },
    seed: () => [rnd(-1, 1), rnd(-1, 1), 0]
  },
  dejong: {
    name: 'De Jong', kind: 'map', dim: 2, span: 2.6, center: [0, 0],
    params: { a: [1.4, -3, 3], b: [-2.3, -3, 3], c: [2.4, -3, 3], d: [-2.1, -3, 3] },
    f(p, s, o) {
      o[0] = Math.sin(p.a * s[1]) - Math.cos(p.b * s[0]);
      o[1] = Math.sin(p.c * s[0]) - Math.cos(p.d * s[1]);
    },
    seed: () => [rnd(-1, 1), rnd(-1, 1), 0]
  }
};

const PALETTES = {
  aurora: { h0: 150, span: 170, sat: 85, lit: 64, label: 'Aurora' },
  ember:  { h0: 352, span: 56,  sat: 92, lit: 60, label: 'Ember' },
  ocean:  { h0: 196, span: 58,  sat: 80, lit: 62, label: 'Ocean' },
  neon:   { h0: 300, span: -170, sat: 95, lit: 62, label: 'Neon' },
  prism:  { h0: 0,   span: 360, sat: 85, lit: 60, label: 'Prism' }
};

const COLOR_MODES = {
  speed: 'Speed',
  depth: 'Depth',
  index: 'Particle index'
};

/* ---------- Helpers --------------------------------------------------- */
const $ = (s) => document.querySelector(s);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
function rnd(a, b) { return a + Math.random() * (b - a); }

/* ---------- State ----------------------------------------------------- */
const canvas = $('#c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const state = {
  attr: 'lorenz',
  params: {},
  paused: false,
  steps: 6,          // integration steps per frame
  count: 3000,       // particle count
  fade: 0.05,        // trail persistence control (higher = shorter trails)
  size: 1.4,
  zoom: 1,
  rotX: 0.35,
  rotY: 0.6,
  autoSpin: 0.15,
  palette: 'aurora',
  colorMode: 'speed'
};

let ATTR = ATTRACTORS[state.attr];
let P = new Float64Array(0);   // particle positions (x, y, z) per particle
let V = new Float64Array(0);   // particle speed for coloring
let vmax = 1e-6;               // adaptive speed normalizer
let dirty = true;
let lut = [];

const S = new Float64Array(3), T = new Float64Array(3);
const K1 = new Float64Array(3), K2 = new Float64Array(3), K3 = new Float64Array(3), K4 = new Float64Array(3);

/* ---------- Setup ----------------------------------------------------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  clearCanvas();
}

function clearCanvas() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  dirty = true;
}

function allocParticles() {
  P = new Float64Array(state.count * 3);
  V = new Float64Array(state.count);
  for (let i = 0; i < state.count; i++) seedParticle(i);
  vmax = 1e-6;
}

function seedParticle(i) {
  const s = ATTR.seed();
  P[i * 3] = s[0];
  P[i * 3 + 1] = s[1];
  P[i * 3 + 2] = s[2];
  V[i] = 0;
}

function buildLUT() {
  const p = PALETTES[state.palette];
  lut = new Array(360);
  for (let h = 0; h < 360; h++) {
    lut[h] = `hsla(${h},${p.sat}%,${p.lit}%,0.8)`;
  }
}

function hueLookup(h) {
  return lut[((Math.round(h) % 360) + 360) % 360];
}

/* ---------- Integration ---------------------------------------------- */
function stepFlow(pr, h) {
  const A = ATTR;
  A.f(pr, S, K1);
  for (let j = 0; j < 3; j++) T[j] = S[j] + 0.5 * h * K1[j];
  A.f(pr, T, K2);
  for (let j = 0; j < 3; j++) T[j] = S[j] + 0.5 * h * K2[j];
  A.f(pr, T, K3);
  for (let j = 0; j < 3; j++) T[j] = S[j] + h * K3[j];
  A.f(pr, T, K4);
  for (let j = 0; j < 3; j++) S[j] += (h / 6) * (K1[j] + 2 * K2[j] + 2 * K3[j] + K4[j]);
  return Math.hypot(K1[0], K1[1], K1[2]);
}

function stepMap(pr) {
  ATTR.f(pr, S, T);
  const sp = Math.hypot(T[0] - S[0], T[1] - S[1]);
  S[0] = T[0];
  S[1] = T[1];
  return sp;
}

function simulate() {
  const A = ATTR;
  const pr = state.params;
  const n = state.count;
  const steps = state.steps;
  const isFlow = A.kind === 'flow';
  let frameMax = 0;

  for (let i = 0; i < n; i++) {
    const o = i * 3;
    S[0] = P[o]; S[1] = P[o + 1]; S[2] = P[o + 2];
    let sp = 0;
    if (isFlow) {
      for (let s = 0; s < steps; s++) sp = stepFlow(pr, A.dt);
    } else {
      for (let s = 0; s < steps; s++) sp = stepMap(pr);
    }

    // Reseed diverged, degenerate (fixed point), or randomly refreshed particles.
    const bad = !Number.isFinite(S[0]) || !Number.isFinite(S[1]) || !Number.isFinite(S[2]) ||
                Math.abs(S[0]) > 1e4 || Math.abs(S[1]) > 1e4 || Math.abs(S[2]) > 1e4;
    if (bad || sp < 1e-10 || Math.random() < 0.00015) {
      const seed = A.seed();
      S[0] = seed[0]; S[1] = seed[1]; S[2] = seed[2];
      sp = 0;
    }

    P[o] = S[0]; P[o + 1] = S[1]; P[o + 2] = S[2];
    V[i] = sp;
    if (sp > frameMax) frameMax = sp;
  }
  vmax = Math.max(vmax * 0.985, frameMax, 1e-9);
}

/* ---------- Render ---------------------------------------------------- */
function render(withFade) {
  const A = ATTR;
  const n = state.count;
  const is3 = A.dim === 3;
  const c = A.center;
  const k = (Math.min(W, H) / (2 * A.span)) * state.zoom;
  const pal = PALETTES[state.palette];
  const cy = Math.cos(state.rotY), sy = Math.sin(state.rotY);
  const cx = Math.cos(state.rotX), sx = Math.sin(state.rotX);
  const mode = state.colorMode;
  const sz = state.size;

  ctx.globalCompositeOperation = 'source-over';
  if (withFade) {
    ctx.fillStyle = `rgba(5,6,10,${state.fade})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < n; i++) {
    const o = i * 3;
    const x = P[o] - c[0];
    const y = P[o + 1] - c[1];
    let X, Y, D = 0;
    if (is3) {
      const z = P[o + 2] - c[2];
      // Yaw about Y, then pitch about X.
      const x1 = x * cy + z * sy;
      const z1 = -x * sy + z * cy;
      X = x1;
      Y = y * cx - z1 * sx;
      D = y * sx + z1 * cx;
    } else {
      X = x;
      Y = y;
    }

    const px = W / 2 + X * k;
    const py = H / 2 - Y * k;
    if (px < -4 || px > W + 4 || py < -4 || py > H + 4) continue;

    let t;
    if (mode === 'speed') t = V[i] / vmax;
    else if (mode === 'depth') t = is3 ? (D / A.span + 1) / 2 : Math.hypot(x, y) / A.span;
    else t = i / n;
    t = clamp01(t);

    ctx.fillStyle = hueLookup(pal.h0 + pal.span * t);
    ctx.fillRect(px, py, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Loop ------------------------------------------------------ */
let last = performance.now();
let fpsFrames = 0, fpsTime = 0, fps = 0;
const hintEl = $('#hint');

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if (!state.paused) {
    if (ATTR.dim === 3 && state.autoSpin > 0 && !dragging) {
      state.rotY += state.autoSpin * dt;
    }
    simulate();
    render(true);
    dirty = false;
  } else if (dirty) {
    clearCanvas();
    render(false);
    dirty = false;
  }

  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    fps = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0;
    fpsTime = 0;
    hintEl.textContent = `${state.count.toLocaleString()} particles · ${fps} fps`;
  }
  requestAnimationFrame(frame);
}

/* ---------- UI ------------------------------------------------------- */
function slider(parent, label, min, max, step, value, onInput, fmt = (v) => v) {
  const wrap = document.createElement('div');
  wrap.className = 'ctl';
  const top = document.createElement('div');
  top.className = 'top';
  const name = document.createElement('span');
  name.textContent = label;
  const out = document.createElement('b');
  top.append(name, out);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;
  input.value = value;
  const paint = () => {
    const p = ((input.value - min) / (max - min)) * 100;
    input.style.setProperty('--p', p + '%');
    out.textContent = fmt(+input.value);
  };
  input.addEventListener('input', () => {
    paint();
    onInput(+input.value);
  });
  paint();
  wrap.append(top, input);
  parent.append(wrap);
  return { input, paint };
}

function buildParamSliders() {
  const box = $('#params');
  box.innerHTML = '';
  for (const [key, [def, min, max]] of Object.entries(ATTR.params)) {
    const step = (max - min) / 1000;
    slider(box, key, min, max, step, state.params[key], (v) => {
      state.params[key] = v;
      dirty = true;
    }, (v) => v.toFixed(3));
  }
}

function setDefaultParams() {
  state.params = {};
  for (const [key, [def]] of Object.entries(ATTR.params)) state.params[key] = def;
}

function selectAttractor(key) {
  state.attr = key;
  ATTR = ATTRACTORS[key];
  setDefaultParams();
  buildParamSliders();
  allocParticles();
  clearCanvas();
  $('#autospin-wrap').style.display = ATTR.dim === 3 ? '' : 'none';
}

function randomize() {
  for (const [key, [, min, max]] of Object.entries(ATTR.params)) {
    state.params[key] = rnd(min, max);
  }
  buildParamSliders();
  allocParticles();
  clearCanvas();
}

function reseed() {
  allocParticles();
  clearCanvas();
}

function setPaused(v) {
  state.paused = v;
  $('#pause').textContent = v ? 'Play' : 'Pause';
  dirty = true;
}

function savePNG() {
  const a = document.createElement('a');
  a.download = `attractor-${state.attr}-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function buildUI() {
  const attrSel = $('#attr');
  for (const [key, def] of Object.entries(ATTRACTORS)) {
    attrSel.append(new Option(def.name, key));
  }
  attrSel.value = state.attr;
  attrSel.addEventListener('change', () => selectAttractor(attrSel.value));

  const palSel = $('#palette');
  for (const [key, p] of Object.entries(PALETTES)) palSel.append(new Option(p.label, key));
  palSel.value = state.palette;
  palSel.addEventListener('change', () => {
    state.palette = palSel.value;
    buildLUT();
    dirty = true;
  });

  const modeSel = $('#colorMode');
  for (const [key, label] of Object.entries(COLOR_MODES)) modeSel.append(new Option('Color by ' + label.toLowerCase(), key));
  modeSel.value = state.colorMode;
  modeSel.addEventListener('change', () => {
    state.colorMode = modeSel.value;
    dirty = true;
  });

  const motion = $('#motion');
  slider(motion, 'Steps per frame', 1, 30, 1, state.steps, (v) => { state.steps = v; }, (v) => v);
  slider(motion, 'Particles', 500, 8000, 100, state.count, (v) => {
    state.count = v;
    allocParticles();
    clearCanvas();
  }, (v) => v.toLocaleString());
  slider(motion, 'Trail persistence', 0.005, 0.25, 0.005, state.fade, (v) => { state.fade = v; },
    (v) => Math.round((1 - v / 0.25) * 100) + '%');

  const look = $('#look');
  slider(look, 'Point size', 0.6, 3, 0.1, state.size, (v) => { state.size = v; dirty = true; }, (v) => v.toFixed(1));
  const spinWrap = document.createElement('div');
  spinWrap.id = 'autospin-wrap';
  look.append(spinWrap);
  slider(spinWrap, 'Auto-rotate', 0, 1, 0.01, state.autoSpin, (v) => { state.autoSpin = v; }, (v) => v.toFixed(2));

  $('#randomize').addEventListener('click', randomize);
  $('#reseed').addEventListener('click', reseed);
  $('#pause').addEventListener('click', () => setPaused(!state.paused));
  $('#save').addEventListener('click', savePNG);

  const panel = $('#panel');
  const toggle = $('#toggle');
  const togglePanel = () => {
    const hidden = panel.classList.toggle('hidden');
    toggle.textContent = hidden ? 'Show panel' : 'Hide panel';
  };
  toggle.addEventListener('click', togglePanel);

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    switch (e.key.toLowerCase()) {
      case ' ': e.preventDefault(); setPaused(!state.paused); break;
      case 'r': randomize(); break;
      case 'e': reseed(); break;
      case 's': savePNG(); break;
      case 'h': togglePanel(); break;
    }
  });

  $('#hint').textContent = '';
}

/* ---------- Pointer interaction -------------------------------------- */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  state.rotY += (e.clientX - lastX) * 0.006;
  state.rotX = Math.max(-1.5, Math.min(1.5, state.rotX + (e.clientY - lastY) * 0.006));
  lastX = e.clientX;
  lastY = e.clientY;
  dirty = true;
});
const endDrag = () => { dragging = false; canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.zoom = Math.max(0.2, Math.min(6, state.zoom * Math.exp(-e.deltaY * 0.001)));
  dirty = true;
}, { passive: false });

/* ---------- Boot ------------------------------------------------------ */
window.addEventListener('resize', resize);
resize();
setDefaultParams();
buildLUT();
buildUI();
selectAttractor(state.attr);
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
